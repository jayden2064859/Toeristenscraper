   services:
     db:
       image: timescale/timescaledb-ha:pg17
       container_name: toeristenscraper-db
       ports:
         - "5433:5432"
       environment:
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
         POSTGRES_DB: toeristenscraper
       volumes:
         - toeristen_data:/home/postgres/pgdata/data
       restart: unless-stopped
   volumes:
     toeristen_data: